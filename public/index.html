<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Ops - アップロード</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0a0a0a; color: #e0e0e0;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px;
  }
  h1 { font-size: 1.6rem; margin-bottom: 8px; color: #fff; }
  .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 32px; }

  .drop-zone {
    width: 100%; max-width: 600px;
    border: 2px dashed #333; border-radius: 16px;
    padding: 60px 20px; text-align: center;
    cursor: pointer; transition: all 0.2s;
    background: #111;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #6c5ce7; background: #1a1530;
  }
  .drop-zone .icon { font-size: 3rem; margin-bottom: 12px; }
  .drop-zone p { color: #aaa; font-size: 0.95rem; }
  .drop-zone .formats { color: #666; font-size: 0.8rem; margin-top: 8px; }

  input[type="file"] { display: none; }

  .progress-area { width: 100%; max-width: 600px; margin-top: 24px; }
  .progress-item {
    background: #161616; border-radius: 10px; padding: 14px 18px;
    margin-bottom: 10px;
  }
  .progress-top { display: flex; align-items: center; gap: 12px; }
  .progress-top .name { flex: 1; font-size: 0.9rem; word-break: break-all; }
  .progress-top .size { color: #888; font-size: 0.8rem; white-space: nowrap; }
  .progress-top .status { font-size: 0.85rem; white-space: nowrap; }
  .status.uploading { color: #fdcb6e; }
  .status.done { color: #00b894; }
  .status.error { color: #d63031; }

  .bar-wrap {
    width: 100%; height: 4px; background: #222; border-radius: 2px; margin-top: 8px;
  }
  .bar {
    height: 100%; background: #6c5ce7; border-radius: 2px;
    transition: width 0.3s; width: 0%;
  }

  .file-list { width: 100%; max-width: 600px; margin-top: 32px; }
  .file-list h2 { font-size: 1.1rem; margin-bottom: 12px; color: #fff; }
  .file-item {
    background: #161616; border-radius: 10px; padding: 12px 18px;
    margin-bottom: 8px; display: flex; justify-content: space-between;
    align-items: center;
  }
  .file-item .fname { font-size: 0.9rem; }
  .file-item .fsize { color: #888; font-size: 0.8rem; }
  .empty { color: #555; font-size: 0.9rem; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 0.75rem; background: #1a2f1a; color: #00b894; margin-left: 8px;
  }
</style>
</head>
<body>

<h1>Video Ops</h1>
<p class="subtitle">動画ファイルをアップロード</p>

<div class="drop-zone" id="dropZone">
  <div class="icon">&#128249;</div>
  <p>ここにドラッグ＆ドロップ<br>またはクリックして選択</p>
  <p class="formats">MP4 / MOV / AVI / MKV / WebM（最大500MB）</p>
</div>
<input type="file" id="fileInput" multiple accept=".mp4,.mov,.avi,.mkv,.webm,.m4v">

<div class="progress-area" id="progressArea"></div>

<div class="file-list" id="fileList">
  <h2>アップロード済み <span id="fileCount" class="badge" style="display:none"></span></h2>
  <div id="fileListBody"><p class="empty">読み込み中...</p></div>
</div>

<script type="module">
import { upload } from "https://unpkg.com/@vercel/blob@0.27.0/dist/index.js";

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const progressArea = document.getElementById("progressArea");
const fileListBody = document.getElementById("fileListBody");
const fileCount = document.getElementById("fileCount");

// Drop zone events
dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener("change", () => { handleFiles(fileInput.files); fileInput.value = ""; });

function handleFiles(files) {
  for (const file of files) {
    uploadFile(file);
  }
}

async function uploadFile(file) {
  const item = document.createElement("div");
  item.className = "progress-item";
  item.innerHTML = `
    <div class="progress-top">
      <span class="name">${file.name}</span>
      <span class="size">${(file.size / 1024 / 1024).toFixed(1)} MB</span>
      <span class="status uploading">アップロード中...</span>
    </div>
    <div class="bar-wrap"><div class="bar"></div></div>
  `;
  progressArea.prepend(item);
  const bar = item.querySelector(".bar");
  const status = item.querySelector(".status");

  try {
    const blob = await upload("videos/" + file.name, file, {
      access: "public",
      handleUploadUrl: "/api/upload",
      onUploadProgress: ({ percentage }) => {
        bar.style.width = percentage + "%";
      },
    });
    status.textContent = "完了";
    status.className = "status done";
    bar.style.width = "100%";
    loadFileList();
  } catch (err) {
    status.textContent = "エラー: " + err.message;
    status.className = "status error";
  }
}

async function loadFileList() {
  try {
    const res = await fetch("/api/files");
    const data = await res.json();
    if (!data.files || !data.files.length) {
      fileListBody.innerHTML = '<p class="empty">ファイルなし</p>';
      fileCount.style.display = "none";
      return;
    }
    fileCount.textContent = data.files.length + "本";
    fileCount.style.display = "inline-block";
    fileListBody.innerHTML = data.files.map(f =>
      `<div class="file-item">
        <span class="fname">${f.name}</span>
        <span class="fsize">${f.size_mb} MB</span>
      </div>`
    ).join("");
  } catch {
    fileListBody.innerHTML = '<p class="empty">ファイルなし</p>';
    fileCount.style.display = "none";
  }
}

loadFileList();
</script>
</body>
</html>
